kind = "web"
previewPath = "/"
title = "Aircraft Radar HUD"
version = "1.0.0"
id = "artifacts/radar-hud"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26002

[services.development]
run = "pnpm --filter @workspace/radar-hud run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/radar-hud", "run", "build" ]
publicDir = "artifacts/radar-hud/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26002"
BASE_PATH = "/"
